name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: weavefield
          POSTGRES_PASSWORD: weavefield_ci_only
          POSTGRES_DB: weavefield_test_ci
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U weavefield -d weavefield_test_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_TEST_URL: postgresql://weavefield:weavefield_ci_only@127.0.0.1:5432/weavefield_test_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @weavefield/database db:validate
        env:
          DATABASE_URL: postgresql://weavefield:weavefield_ci_only@127.0.0.1:5432/weavefield_test_ci?schema=public
      - run: pnpm --filter @weavefield/database db:test
        env:
          DATABASE_TEST_URL: postgresql://weavefield:weavefield_ci_only@127.0.0.1:5432/weavefield_test_ci?schema=public
      - run: pnpm --filter @weavefield/database db:test:upgrade
      - run: pnpm test:auth
      - run: pnpm test:workspaces
      - run: pnpm test:documents
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # 仅上传测试显式生成的 Selection 数值，不上传含凭据的原始 trace / 截图。
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: collaboration-caret-diagnostics
          path: test-results/**/attachments/caret-diagnostics-*.json
          if-no-files-found: ignore
          retention-days: 7
